services:
  - type: web
    name: textify-ocr
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_DB
        value: textify
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
